name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version change
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const manifest = require('./package.json');
          let previousVersion = '';

          if (process.env.EVENT_NAME !== 'workflow_dispatch' && process.env.BEFORE_SHA) {
            try {
              const previousManifest = execFileSync(
                'git',
                ['show', `${process.env.BEFORE_SHA}:package.json`],
                { encoding: 'utf8' },
              );
              previousVersion = JSON.parse(previousManifest).version;
            } catch {
              previousVersion = '';
            }
          }

          const changed = process.env.EVENT_NAME === 'workflow_dispatch'
            || manifest.version !== previousVersion;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `changed=${changed}`,
            `name=${manifest.name}`,
            `version=${manifest.version}`,
            `tag=v${manifest.version}`,
            '',
          ].join('\n'));
          NODE

      - name: Set up Node.js
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Run tests
        if: steps.version.outputs.changed == 'true'
        run: npm test

      - name: Check npm publication
        if: steps.version.outputs.changed == 'true'
        id: npm
        env:
          PACKAGE_NAME: ${{ steps.version.outputs.name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true' && steps.npm.outputs.published != 'true'
        run: npm publish --access public --provenance

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
          fi